{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card card-agri bg-white p-4">
            <h3 class="fw-bold text-primary mb-3"><i class="bi bi-building me-2"></i>Company Login & Registration</h3>

            <ul class="nav nav-pills nav-fill mb-4" id="companyAuthTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#company-login" type="button">
                        Company Login
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#company-register" type="button">
                        New Company Registration
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- LOGIN -->
                <div class="tab-pane fade show active" id="company-login">
                    <form method="POST" action="{{ url_for('company_auth') }}">
                        <input type="hidden" name="action" value="login">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Company Email</label>
                            <input type="email" name="email" class="form-control" placeholder="procurement@company.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Login as Company</button>
                    </form>
                </div>

                <!-- REGISTER -->
                <div class="tab-pane fade" id="company-register">
                    <form method="POST" action="{{ url_for('company_auth') }}">
                        <input type="hidden" name="action" value="register">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Company Name</label>
                            <input type="text" name="company_name" class="form-control" placeholder="e.g., FreshHarvest Foods Pvt Ltd" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Business Type</label>
                                <select name="business_type" class="form-select" required>
                                    <option value="Food Processing">Food Processing</option>
                                    <option value="Retail Supermarket Chain">Retail Supermarket Chain</option>
                                    <option value="Wholesale Distributor">Wholesale Distributor</option>
                                    <option value="Export House">Export House</option>
                                    <option value="Cold Storage & Logistics">Cold Storage & Logistics</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">GST Number</label>
                                <input type="text" name="gst_number" class="form-control" placeholder="e.g., 06AABCF1234A1Z5" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Official Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="buyer@freshharvest.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Register & Access Company Portal</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
