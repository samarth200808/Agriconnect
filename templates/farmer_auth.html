{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card card-agri bg-white p-4">
            <h3 class="fw-bold text-success mb-3"><i class="bi bi-person-badge me-2"></i>Farmer Login & Registration</h3>

            <ul class="nav nav-pills nav-fill mb-4" id="farmerAuthTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#farmer-login" type="button">
                        Farmer Login
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#farmer-register" type="button">
                        New Farmer Registration
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- LOGIN -->
                <div class="tab-pane fade show active" id="farmer-login">
                    <form method="POST" action="{{ url_for('farmer_auth') }}">
                        <input type="hidden" name="action" value="login">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="farmer@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Login as Farmer</button>
                    </form>
                </div>

                <!-- REGISTER -->
                <div class="tab-pane fade" id="farmer-register">
                    <form method="POST" action="{{ url_for('farmer_auth') }}">
                        <input type="hidden" name="action" value="register">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g., Ramesh Kumar" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Land Size Owned</label>
                                <input type="text" name="land_size" class="form-control" placeholder="e.g., 5 Acres" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Place Where Land Is</label>
                                <input type="text" name="land_place" class="form-control" placeholder="e.g., Karnal, Haryana" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Aadhaar Number (No Verification Required)</label>
                            <input type="text" name="aadhaar_number" class="form-control" placeholder="12-digit Aadhaar Number" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="ramesh@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Register & Access Farmer Portal</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
